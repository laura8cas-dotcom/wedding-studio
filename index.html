<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Wedding Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{--lb:#C1D5E7;--db:#1B2238;--pl:#572C47;--ol:#767533;--bg:#FAF8F4;--cd:#fff;--ln:#e6e2da;--tx:#1B2238;--mu:#6b7080;--nv:#572C47;--sf:#eef3f8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121626;--cd:#1B2238;--ln:#2c3350;--tx:#eef2f7;--mu:#9aa5bd;--nv:#2a1423;--sf:#232b45;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Helvetica Neue',Helvetica,Arial,sans-serif}
h1,h2,h3,.sf{font-family:'IM Fell English SC',Georgia,serif;font-weight:400}
aside{position:fixed;inset:0 auto 0 0;width:224px;background:var(--nv);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:2px;overflow:auto}
aside .lg{font-family:'IM Fell English SC',Georgia,serif;font-size:22px;margin-bottom:18px;color:var(--lb)}
aside a{padding:8px 12px;border-radius:8px;cursor:pointer;color:#c9d3e3}aside a:hover{background:#ffffff14}aside a.on{background:var(--lb);color:#1B2238}
main{margin-left:224px;padding:28px 40px 60px;max-width:1180px}
.top{display:flex;gap:10px;margin-bottom:22px}.top input{flex:1}
h2{font-size:34px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 22px}
.hero{background:var(--nv);color:#fff;border-radius:18px;padding:44px 36px;margin-bottom:22px;background-image:linear-gradient(120deg,#572C47 50%,#1B2238)}
.hero small{letter-spacing:.2em;text-transform:uppercase;color:var(--lb)}.hero h1{font-size:46px;margin:8px 0 14px}.cd b{font:400 40px 'IM Fell English SC',Georgia,serif;color:var(--lb)}
.gr{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:22px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px 18px}.c small{color:var(--mu);display:block}.c b{font-size:24px;font-weight:500}
.sec{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}.sec h3{font-size:24px;margin:0}
button{font:inherit;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:8px;padding:7px 14px;cursor:pointer;transition:.15s}button:hover{border-color:var(--tx)}
button.p{background:var(--pl);color:#fff;border-color:var(--pl)}button.i{padding:3px 8px;border:0;background:none;color:var(--mu)}
.sc{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;color:#fff}.pr,.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.vg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.late{color:var(--pl)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}textarea{min-height:64px}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fl input,.fl select{width:auto;flex:1;min-width:130px}
.tw{overflow-x:auto;background:var(--cd);border:1px solid var(--ln);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;font-weight:500;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}td,th{padding:10px 14px;border-bottom:1px solid var(--ln)}tr:last-child td{border:0}tr.gh td{background:var(--sf);font-family:'IM Fell English SC',Georgia,serif;font-size:16px}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--sf)}.Urgente,.No{background:var(--pl);color:#fff}.Alta{background:#d9c2d0;color:#572C47}.Completada,.Confirmado,.Contratado,.Seleccionada{background:var(--ol);color:#fff}
.done{text-decoration:line-through;opacity:.5}.mu{color:var(--mu)}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kb>div{background:var(--sf);border-radius:12px;padding:12px;min-height:120px}.kb .c{margin-top:10px;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button.on{background:var(--pl);color:#fff;border-color:var(--pl)}
.bar{height:8px;border-radius:9px;background:var(--sf);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--ol)}.bar.x i{background:var(--pl)}
.mb{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.md{background:var(--cd);border-radius:16px;padding:24px;width:min(480px,100%);max-height:90vh;overflow:auto;display:grid;gap:10px}.md h3{margin:0;font-size:24px}.md label{font-size:12px;color:var(--mu);display:grid;gap:3px}.ar{display:flex;gap:8px;justify-content:flex-end}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dc{min-height:78px;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:4px 6px;font-size:12px;overflow:hidden}.dc.td{border-color:var(--pl);border-width:2px}.dc em{display:block;font-style:normal;font-size:10px;padding:1px 4px;margin-top:2px;border-radius:4px;background:var(--lb);color:#1B2238;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc em.ta{background:var(--ol);color:#fff}.dc em.pa{background:var(--pl);color:#fff}
.mood{columns:3 200px;gap:14px}.tile{break-inside:avoid;margin-bottom:14px;border-radius:12px;padding:20px;color:#fff;min-height:110px;cursor:pointer}.tile h4{font:400 20px 'IM Fell English SC',Georgia,serif;margin:6px 0}
.tbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--db);margin:2px}.dot.f{background:var(--pl);border-color:var(--pl)}
.tl{border-left:2px solid var(--ln);margin-left:8px}.tl>div{padding:0 0 18px 20px;position:relative}.tl>div:before{content:'';position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--db)}.tl>div.now:before{background:var(--pl);box-shadow:0 0 0 5px #572C4733}.tl b{font:400 20px 'IM Fell English SC',Georgia,serif}
.em{text-align:center;padding:36px;color:var(--mu)}#t{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--db);color:#fff;padding:9px 18px;border-radius:99px;z-index:10;display:none}
@media(max-width:820px){aside{inset:auto 0 0 0;width:auto;flex-direction:row;padding:8px;overflow-x:auto;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5}aside .lg{display:none}aside a{white-space:nowrap;font-size:13px}main{margin:0;padding:20px 16px 100px}.hero h1{font-size:32px}.kb{grid-template-columns:1fr}.cal{gap:2px}.dc{min-height:56px;padding:2px}.dc em{display:none}}
</style></head><body>
<aside id="nv"></aside><main><div class="top"><input id="q" placeholder="Buscar en todo…" oninput="sq(this.value)"><button onclick="form('notes')">+ Nota</button></div><div id="v"></div></main><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),K='wpl1',TD=new Date().toISOString().slice(0,10);
const COL=['tasks','expenses','guests','vendors','pays','events','ideas','tables','moments','docs','dec','notes'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{};S.cfg=S.cfg||{a:'Carlos',b:'Laura',date:'2027-09-25',budget:0};if(S.cfg.a=='Nombre'&&S.cfg.b=='Nombre'){S.cfg.a='Carlos';S.cfg.b='Laura'}if(!S.cfg.date)S.cfg.date='2027-09-25';S.log=S.log||[];COL.forEach(c=>S[c]=S[c]||[]);S.cats=S.cats||['Fotografía','Vídeo','Maquillaje','Peluquería','Vestido de novia','Traje de novio','Finca o lugar de celebración','Catering','Decoración y flores','Música y DJ','Ceremonia','Papelería e invitaciones','Transporte','Alojamiento','Wedding planner','Alquiler de mobiliario','Otros'];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(+n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'}):'';
const lg=t=>{S.log.unshift({t,at:new Date().toLocaleString('es-ES')});S.log=S.log.slice(0,30)};
const toast=t=>{const e=$('#t');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const CB=['Espacio','Catering','Fotografía','Vídeo','Música','Decoración','Flores','Vestimenta','Belleza','Papelería','Transporte','Alojamiento','Regalos','Viaje','Otros'];
const C={
tasks:{n:'Tarea',f:[['name','Nombre','t'],['cat','Categoría','s',['Ceremonia','Celebración','Invitados','Vestimenta','Decoración','Fotografía','Música','Papelería','Viaje','Proveedores','Otros']],['who','Responsable','t'],['due','Fecha límite','d'],['prio','Prioridad','s',['Baja','Media','Alta','Urgente']],['st','Estado','s',['Pendiente','En progreso','Completada']],['notes','Notas','x']]},
expenses:{n:'Gasto',f:[['name','Concepto','t'],['cat','Categoría','s',CB],['vendor','Proveedor','t'],['plan','Previsto (€)','n'],['final','Importe final (€)','n'],['paid','Pagado (€)','n'],['date','Fecha de pago','d'],['notes','Notas','x']]},
guests:{n:'Invitado',f:[['name','Nombre y apellidos','t'],['group','Grupo / familia','t'],['plus','Acompañantes (nº)','n'],['inv','Invitación','s',['Sin enviar','Enviada']],['rsvp','Confirmación','s',['Pendiente','Confirmado','No asiste']],['phone','Teléfono','t'],['email','Email','t'],['diet','Dieta / alergias / necesidades','t'],['notes','Notas (transporte, alojamiento…)','x']]},
vendors:{n:'Proveedor',f:[['name','Nombre','t'],['cat','Categoría','s',CB],['st','Estado','s',['Por investigar','Contactado','Presupuesto recibido','Pendiente de decisión','Contratado','Descartado']],['price','Precio (€)','n'],['rating','Valoración (1-5)','n'],['contact','Contacto / teléfono / email','t'],['incl','Servicios incluidos','t'],['avail','Disponibilidad','t'],['pros','Ventajas','t'],['cons','Inconvenientes','t'],['notes','Notas','x']]},
events:{n:'Evento',f:[['name','Título','t'],['date','Fecha','d'],['time','Hora','m'],['type','Tipo','s',['Reunión','Visita','Prueba','Evento','Otro']]]},
ideas:{n:'Idea',f:[['name','Título','t'],['cat','Categoría','s',['Decoración','Flores','Vestidos','Fotografía','Vídeo','Papelería','Música','Invitaciones','Banquete','Detalles','Viaje']],['st','Estado','s',['Idea','Por valorar','Seleccionada','Descartada']],['url','Enlace','t'],['notes','Notas','x']]},
tables:{n:'Mesa',f:[['name','Nombre','t'],['cap','Capacidad','n']]},
tl:{n:'Actividad',f:[['name','Nombre','t'],['time','Hora','m'],['dur','Duración (min)','n'],['place','Ubicación','t'],['who','Responsable / proveedor','t'],['notes','Notas','x']]},
docs:{n:'Documento',f:[['name','Nombre','t'],['cat','Categoría','s',['Contratos','Presupuestos','Facturas','Invitaciones','Documentación legal','Fotografías','Referencias','Otros']],['url','Enlace (Drive, Dropbox…)','t'],['notes','Notas','x']]},
dec:{n:'Decisión',f:[['name','Decisión','t'],['alt','Alternativas','x'],['pros','Ventajas / inconvenientes','x'],['res','Resultado final','t']]},
notes:{n:'Nota',f:[['name','Nota','x']]}};
const NAV=[['home','Inicio'],['plan','Planificación'],['bud','Presupuesto'],['gue','Invitados'],['ven','Proveedores'],['cal','Calendario'],['ins','Inspiración'],['tab','Mesas'],['day','Día de la boda'],['doc','Documentación'],['cfg','Configuración']];
let view='home',sub='l',F={q:'',c:'',s:''},GG=false,VC='',IS='',CM=new Date(new Date().getFullYear(),new Date().getMonth(),1),Q='';
let OV=null,PRE={};const cm=()=>{$('#m').innerHTML='';OV=null};const cx=()=>{const v=OV;cm();if(v)fiche(v)};
function form(col,id,pre){if(col=='moments')return mform(id,pre);PRE=pre||{};const c=C[col],o=id?S[col].find(x=>x.id==id):{...PRE};
$('#m').innerHTML=`<div class=mb onclick="if(event.target==this)cx()"><form class=md onsubmit="return sv(event,'${col}','${id||''}')"><h3>${id?'Editar':'Nuevo'} · ${c.n}</h3>${c.f.map(([k,l,t,op],i)=>`<label>${l}${t=='s'?`<select name=${k}>${(typeof op=='function'?op():op).map(v=>{const[a,b]=Array.isArray(v)?v:[v,v];return`<option value="${E(a)}" ${o[k]==a?'selected':''}>${E(b)}</option>`}).join('')}</select>`:t=='x'?`<textarea name=${k}>${E(o[k])}</textarea>`:`<input name=${k} type=${{d:'date',n:'number',m:'time',t:'text'}[t]} step=any value="${E(o[k])}" ${i==0?'required':''}>`}</label>`).join('')}<div class=ar><button type=button onclick=cx()>Cancelar</button><button class=p>Guardar</button></div></form></div>`}
function sv(e,col,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),o=id&&S[col].find(x=>x.id==id);if(col=='pays'&&d.st=='Pagado'&&!d.paidOn)d.paidOn=TD;if(o){Object.assign(o,d);delete o.demo}else S[col].push({id:uid(),...PRE,...d});if(col=='tasks')aS(o||S.tasks[S.tasks.length-1]);lg((id?'Editado':'Añadido')+' · '+C[col].n+': '+String(d[C[col].f[0][0]]).slice(0,40));const ov=OV;save();cm();R();if(ov)fiche(ov);return false}
function ask(msg,fn){window._f=fn;$('#m').innerHTML=`<div class=mb><div class=md><h3>${msg}</h3><div class=ar><button onclick=cx()>Cancelar</button><button class=p onclick="cm();_f()">Eliminar</button></div></div></div>`}
function del(col,id){ask('¿Eliminar este elemento?',()=>{S[col]=S[col].filter(x=>x.id!=id);if(col=='tables')S.guests.forEach(g=>{if(g.tb==id)delete g.tb});lg('Eliminado · '+C[col].n);save();R()})}
const ib=(c,i)=>`<button class=i onclick="form('${c}','${i}')">✎</button><button class=i onclick="del('${c}','${i}')">✕</button>`;
const bd=t=>`<span class="bd ${String(t).split(' ')[0]}">${E(t)}</span>`;
const em=(t,c)=>`<div class=em>${t}<br><br><button class=p onclick="form('${c}')">+ Añadir</button></div>`;
const P=g=>g.rsvp=='No asiste'?0:1+(+g.plus||0);
function B(){const x=S.expenses,t=e=>+e.final||+e.plan||0,com=x.reduce((s,e)=>s+t(e),0),paid=x.reduce((s,e)=>s+(+e.paid||0),0),bud=+S.cfg.budget||0;return{bud,com,paid,pen:com-paid,av:bud-com,t}}
function G(){const g=S.guests,n=f=>g.filter(f).reduce((s,x)=>s+P(x),0);return{tot:n(()=>1),ok:n(x=>x.rsvp=='Confirmado'),pe:n(x=>x.rsvp=='Pendiente'),no:n(x=>x.rsvp=='No asiste'),inv:g.length}}
function ag(){return[...S.events.filter(e=>e.date).map(e=>({d:e.date,t:(e.time||'')+' '+e.name,k:'ev'})),...S.tasks.filter(t=>t.due&&t.st!='Completada').map(t=>({d:t.due,t:'Tarea: '+t.name,k:'ta'})),...S.expenses.filter(e=>e.date&&B().t(e)>(+e.paid||0)).map(e=>({d:e.date,t:'Pago: '+e.name,k:'pa'}))].sort((a,b)=>a.d<b.d?-1:1)}
const st=(l,v,s='')=>`<div class=c><small>${l}</small><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
const V={};
V.home=()=>{const t=S.tasks,dn=t.filter(x=>x.st=='Completada').length,pc=t.length?Math.round(dn/t.length*100):0,b=B(),g=G(),d=S.cfg.date?Math.ceil((new Date(S.cfg.date+'T00:00')-new Date(TD+'T00:00'))/864e5):null,up=ag().filter(a=>a.d>=TD).slice(0,6);
return`<section class=hero><small>${E(S.cfg.a)} &amp; ${E(S.cfg.b)}</small><h1>Wedding Studio</h1><div class=cd>${d==null?'<a style="cursor:pointer;color:var(--lb)" onclick="go(\'cfg\')">Define la fecha en Configuración →</a>':d>0?`<b>${d}</b> días · ${fd(S.cfg.date)}`:d==0?'<b>Hoy</b>':'Celebrado'}</div></section>
<div class=fl><button class=p onclick="form('tasks')">+ Tarea</button><button class=p onclick="form('guests')">+ Invitado</button><button class=p onclick="form('expenses')">+ Gasto</button><button class=p onclick="form('vendors')">+ Proveedor</button></div>
<div class=gr>${st('Tareas completadas',pc+'%',dn+' de '+t.length)}${st('Pendientes',t.length-dn)}${st('Urgentes',t.filter(x=>x.prio=='Urgente'&&x.st!='Completada').length)}</div>
<div class=gr>${st('Presupuesto',eur(b.bud))}${st('Gastado (pagado)',eur(b.paid))}${st('Pendiente de pago',eur(b.pen))}${st('Disponible',eur(b.av),'tras compromisos')}${st('Proveedores contratados',S.vendors.filter(v=>v.st=='Contratado'||v.st=='Servicio completado').length+'/'+S.vendors.length)}</div>
<div class=gr>${st('Invitados',g.tot,g.inv+' invitaciones')}${st('Confirmados',g.ok)}${st('Pendientes',g.pe)}${st('No asisten',g.no)}</div>
<div class=sec><h3>Próximos acontecimientos</h3></div>${up.length?`<div class=c>${up.map(a=>`<div style="cursor:pointer" onclick="op('${a.r[0]}','${a.r[1]}')"><b style="font-weight:500">${fd(a.d)}</b> · ${E(a.t)}</div>`).join('')}</div>`:'<div class=c mu>Sin fechas próximas. Añade tareas con fecha, pagos o eventos.</div>'}
<div class=sec><h3>Notas rápidas</h3></div><div class=c>${S.notes.map(n=>`<div>${E(n.name)} ${ib('notes',n.id)}</div>`).join('')||'<span class=mu>Usa “+ Nota” arriba desde cualquier sección.</span>'}</div>
<div class=sec><h3>Actividad reciente</h3></div><div class="c mu">${S.log.slice(0,6).map(l=>`<div>${E(l.t)} <small>· ${l.at}</small></div>`).join('')||'Aún no hay cambios.'}</div>`};
function tl_(){const q=F.q.toLowerCase();return S.tasks.filter(t=>(!F.c||t.cat==F.c)&&(!F.s||t.st==F.s)&&(!q||(t.name+t.notes+t.who).toLowerCase().includes(q)))}
const tog=id=>{const t=S.tasks.find(x=>x.id==id);t.st=t.st=='Completada'?'Pendiente':'Completada';aS(t);lg((t.st=='Completada'?'Completada':'Reabierta')+': '+t.name);save();R()};
const mv=(id,d)=>{const o=C.tasks.f[5][3],t=S.tasks.find(x=>x.id==id),i=o.indexOf(t.st)+d;if(o[i]){t.st=o[i];aS(t);save();R()}};
function taskList(){const a=tl_();if(!a.length)return S.tasks.length?'<div class=em>Nada con esos filtros.</div>':em('Aún no hay tareas.','tasks');
if(sub=='k')return`<div class=kb>${C.tasks.f[5][3].map(s=>`<div><b>${s}</b> <span class=mu>${a.filter(t=>t.st==s).length}</span>${a.filter(t=>t.st==s).map(t=>`<div class=c><div>${E(t.name)}</div><small>${E(t.who)} ${fd(t.due)}</small> ${bd(t.prio)}<div><button class=i onclick="mv('${t.id}',-1)">◀</button><button class=i onclick="mv('${t.id}',1)">▶</button>${ib('tasks',t.id)}</div></div>`).join('')}</div>`).join('')}</div>`;
